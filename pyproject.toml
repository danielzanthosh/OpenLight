[project]
name = "openlight"
version = "0.1.0"
description = "Autonomous AI Agent with Screen Control (CUA), Hermes Reasoning Loop, and Multi-Provider LLMs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "google-genai>=1.0.0",
    "httpx>=0.28.0",
    "mss>=9.0.0",
    "openai>=1.60.0",
    "pillow>=10.4.0",
    "prompt-toolkit>=3.0.48",
    "pyautogui>=0.9.54",
    "pydantic>=2.10.0",
    "pywin32>=308; sys_platform == 'win32'",
    "rich>=13.9.0",
    "uiautomation>=2.0.19; sys_platform == 'win32'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
openlight = "openlight.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openlight"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["Reference", ".*", "dist", "build"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]
